name: Build Samsung Firmware Downloader APK
on:
  push:
    branches: [ firmware-downloader ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Fetch Rust dependencies
        working-directory: firmwareapp/rust
        run: cargo metadata --format-version 1 > /dev/null

      - name: Build Rust native library
        working-directory: firmwareapp/rust
        run: |
          mkdir -p ../src/main/jniLibs
          cargo ndk -t arm64-v8a -o ../src/main/jniLibs build --release

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon :firmwareapp:assembleDebug

      - name: Prepare APK
        run: cp firmwareapp/build/outputs/apk/debug/firmwareapp-debug.apk Samsung-Firmware-Downloader-1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Samsung-Firmware-Downloader-1.0
          path: Samsung-Firmware-Downloader-1.0.apk
          retention-days: 30
