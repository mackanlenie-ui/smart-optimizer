name: Build S23 Ultra Toolbox APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare artifact and signer
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk S23-Ultra-Toolbox-9.4-unsigned.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p apksigner-tool/lib
          cp "$BT/apksigner" apksigner-tool/
          cp "$BT/lib/apksigner.jar" apksigner-tool/lib/
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: S23-Ultra-Toolbox-9.4-unsigned
          path: S23-Ultra-Toolbox-9.4-unsigned.apk
          retention-days: 30
      - name: Upload apksigner tool
        uses: actions/upload-artifact@v4
        with:
          name: apksigner-tool-9.4
          path: apksigner-tool
          retention-days: 30
