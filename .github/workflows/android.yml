name: Build Smart Optimizer APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Smart-Optimizer-8.0-S23-Ultra.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Optimizer-8.0-S23-Ultra
          path: Smart-Optimizer-8.0-S23-Ultra.apk
          retention-days: 30
