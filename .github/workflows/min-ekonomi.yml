name: Build Min Ekonomi v2.1
on:
  push:
    branches: [ min-ekonomi-v21 ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix biometric import
        run: sed -i '/import android.app.\*/a import android.hardware.biometrics.BiometricPrompt;' min-ekonomi/app/src/main/java/se/minekonomi/app/MainActivity.java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: min-ekonomi
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare APK
        run: cp min-ekonomi/app/build/outputs/apk/debug/app-debug.apk Min-Ekonomi-v2.1.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Min-Ekonomi-v2.1
          path: Min-Ekonomi-v2.1.apk
          retention-days: 30
