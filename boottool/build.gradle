plugins { id 'com.android.application' }

android {
    namespace 'se.s23.boottool'
    compileSdk 35

    defaultConfig {
        applicationId 'se.s23.boottool'
        minSdk 26
        targetSdk 35
        versionCode 13
        versionName '1.3'
        ndk { abiFilters 'arm64-v8a' }
    }

    packaging { jniLibs { useLegacyPackaging = true } }
}

dependencies { }
